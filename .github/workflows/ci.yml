name: CI - Backend Tests, Frontend Build & Contract Parity

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements_security.txt
          pip install pytest pytest-asyncio pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run full test suite
        run: pytest -v --tb=short

      - name: Check lazy import ban
        run: python scripts/precommit_ban_imports.py server/

  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dump current API contracts
        run: python scripts/contracts_dump.py --output-dir /tmp/contracts

      - name: Check API parity
        run: |
          python scripts/contracts_diff.py \
            --baseline-dir tests/contracts \
            --current-dir /tmp/contracts \
            --strict

  frontend:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated API types are in sync with the committed contract
        run: |
          npm run generate:api-types
          git diff --exit-code src/types/api-generated.ts \
            || (echo "::error::ui/src/types/api-generated.ts is stale — run 'npm run generate:api-types' after the backend contract changes and commit the result" && exit 1)

      - name: Build
        run: npm run build
